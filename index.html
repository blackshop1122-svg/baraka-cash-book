<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<title>Barakah Cash Book</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:#eef2f7;
  color:#172033;
}
button,input,select{font:inherit}
button{cursor:pointer;border:0}

#lock{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:#0f172a;
}
.login-box{
  width:100%;
  max-width:430px;
  background:white;
  border-radius:25px;
  padding:35px 25px;
  text-align:center;
}
.lock-icon{font-size:65px}
.login-box h1{margin:10px 0;font-size:28px}
.login-box p{font-size:18px}
.login-box input{
  width:100%;
  padding:16px;
  border:1px solid #cbd5e1;
  border-radius:12px;
  margin:10px 0;
  text-align:center;
  font-size:22px;
}
.login-btn{
  width:100%;
  padding:16px;
  border-radius:12px;
  background:#128477;
  color:white;
  font-weight:bold;
  font-size:18px;
}
#error{color:#dc2626;min-height:25px}

header{
  background:#0f172a;
  color:white;
  padding:18px;
  text-align:center;
}
header h1{margin:0;font-size:25px}
header p{margin:6px 0 0;color:#cbd5e1}

.container{
  max-width:1100px;
  margin:auto;
  padding:15px;
}
.card{
  background:white;
  border-radius:16px;
  padding:16px;
  margin-bottom:15px;
  box-shadow:0 2px 8px #00000012;
}
.card h2,.card h3{margin-top:0}

.month-box{
  display:flex;
  gap:8px;
  align-items:center;
}
.month-box button{
  padding:12px 16px;
  border-radius:10px;
  background:#334155;
  color:white;
}
.month-box select{
  flex:1;
  padding:12px;
  border:1px solid #cbd5e1;
  border-radius:10px;
  background:white;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
.field label{
  display:block;
  font-weight:bold;
  margin-bottom:5px;
}
.field input{
  width:100%;
  padding:12px;
  border:2px solid #dbe2ea;
  border-radius:10px;
}
.field input:focus{
  outline:none;
  border-color:#128477;
}

.dp{background:#fff3bf}
.dpb{background:#dcfce7}
.dpn{background:#f3e8ff}
.cash{background:#dbeafe}
.ibk{background:#ccfbf1}
