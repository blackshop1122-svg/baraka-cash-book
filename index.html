<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0f766e">
<title>আমার Cash Book</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;background:#f3f6f8;color:#17202a}
header{background:#0f766e;color:#fff;padding:18px 14px;position:sticky;top:0;z-index:5}
h1{font-size:21px;margin:0 0 4px}.sub{font-size:13px;opacity:.9}
.container{padding:12px;max-width:900px;margin:auto}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #00000012}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
label{font-size:12px;font-weight:700;color:#52606d;display:block;margin-bottom:4px}
input{width:100%;padding:11px;border:1px solid #d5dce1;border-radius:9px;font-size:16px;background:#fff}
button{border:0;border-radius:9px;padding:11px 14px;font-weight:700;font-size:15px;cursor:pointer}
.primary{background:#0f766e;color:white;width:100%;margin-top:10px}
.danger{background:#fee2e2;color:#991b1b}
.small{font-size:12px;color:#667085}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sum{background:#f0fdfa;border:1px solid #ccfbf1;border-radius:10px;padding:10px}.sum b{display:block;font-size:18px;margin-top:3px}
.total{background:#ecfdf5;border-color:#a7f3d0}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:760px}
th,td{padding:8px 6px;border-bottom:1px solid #e8edf0;text-align:left;white-space:nowrap}
th{background:#f7fafb;position:sticky;top:72px}
.tablewrap{overflow:auto}
.row-actions button{padding:6px 8px;font-size:12px}
.empty{text-align:center;color:#8a94a0;padding:20px}
@media(max-width:520px){.grid{grid-template-columns:1fr 1fr}.summary{grid-template-columns:1fr 1fr} .container{padding:9px} h1{font-size:19px}}
</style>
</head>
<body>
<header><h1>📒 আমার Cash Book</h1><div class="sub">DP ও INS-এর দৈনিক হিসাব</div></header>
<div class="container">
<div class="card">
  <div class="grid">
    <div><label>তারিখ</label><input id="date" type="date"></div>
    <div><label>কাস্টমারের সিরিয়াল নং</label><input id="serial" inputmode="numeric" placeholder="যেমন 324"></div>
    <div style="grid-column:1/-1"><label>কাস্টমারের নাম</label><input id="name" placeholder="কাস্টমারের নাম"></div>
    <div><label>DP</label><input id="dp" type="number" inputmode="decimal" min="0" placeholder="0"></div>
    <div><label>INS Cash</label><input id="cash" type="number" inputmode="decimal" min="0" placeholder="0"></div>
    <div><label>INS bKash</label><input id="bkash" type="number" inputmode="decimal" min="0" placeholder="0"></div>
    <div><label>INS Nagad</label><input id="nagad" type="number" inputmode="decimal" min="0" placeholder="0"></div>
  </div>
  <button class="primary" onclick="addEntry()">➕ হিসাব যোগ করুন</button>
</div>

<div class="card">
  <div class="summary">
    <div class="sum"><span>মোট DP</span><b id="sdp">৳0</b></div>
    <div class="sum"><span>INS Cash</span><b id="scash">৳0</b></div>
    <div class="sum"><span>INS bKash</span><b id="sbkash">৳0</b></div>
    <div class="sum"><span>INS Nagad</span><b id="snagad">৳0</b></div>
    <div class="sum"><span>INS Total</span><b id="sins">৳0</b></div>
    <div class="sum total"><span>সর্বমোট</span><b id="stotal">৳0</b></div>
  </div>
</div>

<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
    <div><b>এন্ট্রির তালিকা</b><div class="small">ডেটা এই ফোনের ব্রাউজারেই সংরক্ষিত থাকবে।</div></div>
    <button class="danger" onclick="clearAll()">সব মুছুন</button>
  </div>
  <div class="tablewrap" style="margin-top:10px">
    <table><thead><tr><th>তারিখ</th><th>নাম</th><th>সিরিয়াল</th><th>DP</th><th>INS Cash</th><th>INS bKash</th><th>INS Nagad</th><th>INS Total</th><th>সর্বমোট</th><th></th></tr></thead>
    <tbody id="rows"></tbody></table>
  </div>
</div>
</div>
<script>
const KEY='my_cash_book_v2', OLD_KEY='my_cash_book_v1';
const $=id=>document.getElementById(id);
const num=id=>{const v=String($(id).value||'').replace(/,/g,'').trim();const n=Number(v);return Number.isFinite(n)?n:0};
const money=x=>'৳'+Math.round(Number(x)||0).toLocaleString('en-US');
function loadData(){try{let raw=localStorage.getItem(KEY);if(raw===null){raw=localStorage.getItem(OLD_KEY)||'[]';if(raw!=='[]')localStorage.setItem(KEY,raw)}const d=JSON.parse(raw);return Array.isArray(d)?d:[]}catch(e){return []}}
let data=loadData();
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function addEntry(){const name=$('name').value.trim();if(!name){alert('কাস্টমারের নাম লিখুন।');$('name').focus();return}const dp=num('dp'),cash=num('cash'),bkash=num('bkash'),nagad=num('nagad'),ins=cash+bkash+nagad;data.unshift({id:Date.now(),date:$('date').value||new Date().toISOString().slice(0,10),serial:$('serial').value.trim(),name,dp,cash,bkash,nagad,ins,total:dp+ins});save();['serial','name','dp','cash','bkash','nagad'].forEach(id=>$(id).value='');$('name').focus()}
function deleteEntry(id){if(confirm('এই হিসাবটি মুছে ফেলবেন?')){data=data.filter(e=>e.id!==id);save()}}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){let dpT=0,cashT=0,bkashT=0,nagadT=0;const rows=data.map(e=>{const dp=Number(e.dp)||0,cash=Number(e.cash)||0,bkash=Number(e.bkash)||0,nagad=Number(e.nagad)||0,ins=cash+bkash+nagad,total=dp+ins;dpT+=dp;cashT+=cash;bkashT+=bkash;nagadT+=nagad;return `<tr><td>${escapeHtml(e.date||'')}</td><td>${escapeHtml(e.serial||'')}</td><td>${escapeHtml(e.name||'')}</td><td>${money(dp)}</td><td>${money(cash)}</td><td>${money(bkash)}</td><td>${money(nagad)}</td><td>${money(ins)}</td><td>${money(total)}</td><td><button class="del" onclick="deleteEntry(${Number(e.id)})">মুছুন</button></td></tr>`}).join('');$('sdp').textContent=money(dpT);$('scash').textContent=money(cashT);$('sbkash').textContent=money(bkashT);$('snagad').textContent=money(nagadT);const insT=cashT+bkashT+nagadT;$('sins').textContent=money(insT);$('stotal').textContent=money(dpT+insT);$('tbody').innerHTML=rows||`<tr><td colspan="10" style="text-align:center;padding:20px">এখনও কোনো হিসাব যোগ করা হয়নি।</td></tr>`}
document.addEventListener('DOMContentLoaded',()=>{$('date').value=new Date().toISOString().slice(0,10);$('addBtn').addEventListener('click',addEntry);render()});
</script>
</body>
</html>
