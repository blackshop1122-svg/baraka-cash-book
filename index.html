<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<title>Barakah Cash Book</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#172033}
#lock{position:fixed;inset:0;background:#0f172a;display:flex;align-items:center;justify-content:center;z-index:10}
.lockbox{background:white;padding:30px;border-radius:20px;width:90%;max-width:350px;text-align:center}
.lockbox h2{margin:10px 0}
input{width:100%;padding:12px;margin:5px 0 10px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px}
button{border:0;border-radius:9px;padding:11px 15px;font-size:15px;font-weight:bold;cursor:pointer}
.primary{background:#0f766e;color:white;width:100%}
.danger{background:#fee2e2;color:#991b1b}
.secondary{background:#475569;color:white}
#app{display:none;max-width:1000px;margin:auto;padding:10px}
header{background:#0f172a;color:white;padding:18px;border-radius:15px;margin-bottom:12px}
header h1{margin:0}
header p{margin:5px 0 0;color:#cbd5e1}
.card{background:white;padding:15px;border-radius:15px;margin-bottom:12px;box-shadow:0 2px 8px #0001}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
label{font-size:13px;font-weight:bold;color:#475569}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#f8fafc;padding:10px;border-radius:10px}
.stat small{display:block;color:#64748b}
.stat b{font-size:18px}
.table{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:850px}
th,td{padding:8px;border-bottom:1px solid #e2e8f0;white-space:nowrap}
th{background:#f8fafc}
.edit{background:#e2e8f0}
.del{background:#fee2e2;color:#991b1b}
#error{color:#b91c1c;height:22px}
@media(max-width:650px){
.grid{grid-template-columns:1fr 1fr}
.summary{grid-template-columns:1fr 1fr}
}
</style>
</head>

<body>

<div id="lock">
<div class="lockbox">
<div style="font-size:50px">🔐</div>
<h2>Barakah Cash Book</h2>
<p>পাসওয়ার্ড দিয়ে প্রবেশ করুন</p>
<input id="password" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
<div id="error"></div>
<button class="primary" onclick="login()">প্রবেশ করুন</button>
</div>
</div>

<div id="app">

<header>
<h1>📒 Barakah Cash Book</h1>
<p>DP ও INS-এর দৈনিক হিসাব</p>
</header>

<div class="card">
<h3>নতুন হিসাব</h3>

<div class="grid">

<div>
<label>তারিখ</label>
<input id="date" type="date">
</div>

<div>
<label>Customer Serial</label>
<input id="serial">
</div>

<div>
<label>Customer Name</label>
<input id="name">
</div>

<div>
<label>DP</label>
<input id="dp" type="number">
</div>

<div>
<label>INS Cash</label>
<input id="cash" type="number">
</div>

<div>
<label>INS bKash</label>
<input id="bkash" type="number">
</div>

<div>
<label>INS Nagad</label>
<input id="nagad" type="number">
</div>

</div>

<div class="actions">
<button id="saveBtn" class="primary" style="width:auto" onclick="saveEntry()">➕ হিসাব যোগ করুন</button>
<button class="secondary" onclick="clearForm()">ফর্ম পরিষ্কার</button>
<button class="danger" onclick="clearAll()">সব হিসাব মুছুন</button>
</div>
</div>

<div class="card">
<h3>📊 মোট হিসাব</h3>

<div class="summary">

<div class="stat">
<small>মোট DP</small>
<b id="totalDP">0.00</b>
</div>

<div class="stat">
<small>INS Cash</small>
<b id="totalCash">0.00</b>
</div>

<div class="stat">
<small>INS bKash</small>
<b id="totalBkash">0.00</b>
</div>

<div class="stat">
<small>INS Nagad</small>
<b id="totalNagad">0.00</b>
</div>

<div class="stat">
<small>INS Total</small>
<b id="totalINS">0.00</b>
</div>

<div class="stat">
<small>Grand Total</small>
<b id="grandTotal">0.00</b>
</div>

</div>
</div>

<div class="card">
<h3>📋 হিসাবের তালিকা</h3>

<div class="table">
<table>
<thead>
<tr>
<th>তারিখ</th>
<th>Serial</th>
<th>নাম</th>
<th>DP</th>
<th>Cash</th>
<th>bKash</th>
<th>Nagad</th>
<th>INS Total</th>
<th>Total</th>
<th>কাজ</th>
</tr>
</thead>

<tbody id="rows"></tbody>

</table>
</div>
</div>

</div>

<script>

const KEY="barakah_cash_book";
let data=JSON.parse(localStorage.getItem(KEY)||"[]");
let editIndex=-1;

function $(id){
return document.getElementById(id);
}

function money(n){
return (Number(n)||0).toFixed(2);
}

function today(){
let d=new Date();
d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
return d.toISOString().slice(0,10);
}

function login(){

if($("password").value==="6175"){

$("lock").style.display="none";
$("app").style.display="block";
sessionStorage.setItem("login","yes");

$("date").value=today();

render();

}else{

$("error").textContent="পাসওয়ার্ড ভুল হয়েছে";
$("password").value="";

}

}

function saveEntry(){

let entry={
date:$("date").value||today(),
serial:$("serial").value,
name:$("name").value,
dp:Number($("dp").value)||0,
cash:Number($("cash").value)||0,
bkash:Number($("bkash").value)||0,
nagad:Number($("nagad").value)||0
};

if(!entry.name && !entry.serial){

alert("Customer Name অথবা Serial দিন");
return;

}

if(editIndex>=0){

data[editIndex]=entry;
editIndex=-1;
$("saveBtn").textContent="➕ হিসাব যোগ করুন";

}else{

data.push(entry);

}

localStorage.setItem(KEY,JSON.stringify(data));

clearForm();
render();

}

function editEntry(i){

let e=data[i];

$("date").value=e.date;
$("serial").value=e.serial;
$("name").value=e.name;
$("dp").value=e.dp;
$("cash").value=e.cash;
$("bkash").value=e.bkash;
$("nagad").value=e.nagad;

editIndex=i;
$("saveBtn").textContent="💾 হিসাব আপডেট করুন";

window.scrollTo(0,0);

}

function deleteEntry(i){

if(confirm("এই হিসাবটি মুছে ফেলবেন?")){

data.splice(i,1);
localStorage.setItem(KEY,JSON.stringify(data));
render();

}

}

function clearAll(){

if(data.length && confirm("সব হিসাব মুছে ফেলবেন?")){

data=[];
localStorage.setItem(KEY,JSON.stringify(data));
render();

}

}

function clearForm(){

$("date").value=today();
$("serial").value="";
$("name").value="";
$("dp").value="";
$("cash").value="";
$("bkash").value="";
$("nagad").value="";

editIndex=-1;
$("saveBtn").textContent="➕ হিসাব যোগ করুন";

}

function render(){

let dp=0,cash=0,bkash=0,nagad=0;

$("rows").innerHTML="";

data.forEach((e,i)=>{

dp+=e.dp;
cash+=e.cash;
bkash+=e.bkash;
nagad+=e.nagad;

let ins=e.cash+e.bkash+e.nagad;
let total=e.dp+ins;

$("rows").innerHTML+=`

<tr>

<td>${e.date}</td>
<td>${e.serial}</td>
<td>${e.name}</td>
<td>${money(e.dp)}</td>
<td>${money(e.cash)}</td>
<td>${money(e.bkash)}</td>
<td>${money(e.nagad)}</td>
<td>${money(ins)}</td>
<td><b>${money(total)}</b></td>

<td>
<button class="edit" onclick="editEntry(${i})">✏️</button>
<button class="del" onclick="deleteEntry(${i})">🗑️</button>
</td>

</tr>

`;

});

let ins=cash+bkash+nagad;

$("totalDP").textContent=money(dp);
$("totalCash").textContent=money(cash);
$("totalBkash").textContent=money(bkash);
$("totalNagad").textContent=money(nagad);
$("totalINS").textContent=money(ins);
$("grandTotal").textContent=money(dp+ins);

}

window.onload=function(){

$("date").value=today();

if(sessionStorage.getItem("login")==="yes"){

$("lock").style.display="none";
$("app").style.display="block";
render();

}

};

</script>

</body>
</html>
